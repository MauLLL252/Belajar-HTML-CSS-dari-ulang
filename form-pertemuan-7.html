<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar membuat form</title>
</head>
<body>
    <form>
        <label for="nama_depan">Nama Depan:</label>
        <input type="text" name="username" id="nama_depan">
        <br>
        <label for="nama_belakang">Nama Belakang:</label>
        <input type="text" name="username" id="nama_belakang">
        <br>
        <h4>WNI: Radio button</h4>
        <input type="radio" name="radio" id="WNI">
        <label for="WNI">YES</label>
        <input type="radio" name="radio" id="WNI">
        <label for="WNI">NO</label>
        <br>
        <h4>Musik Favorit: (Checkbox)</h4>
        <input type="checkbox" name="dangdut" id="dangdut">
        <label for="dangdut">Dangdut</label><br>
        <input type="checkbox" name="Jazz" id="Jazz">
        <label for="Jazz">Jazz</label><br>
        <h4>Dropdown List</h4>
        <br>
        <select name="pekerjaan" id="pekerjaan">
            <option value="mahasiswa">mahasiswa</option>
            <option value="wirausaha">wirausaha</option>
        </select><br>
        <h4>Upload File</h4><br>
        <input type="file" name="gambar" id="gambar"><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
